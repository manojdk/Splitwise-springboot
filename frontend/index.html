<!doctype html>
<html lang="en" data-theme="aurora">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Split shared expenses with friends and groups, in any currency." />
    <title>Splitwise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Orbitron:wght@500;700;900&family=Sora:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Unbounded:wght@500;700;800&display=swap"
    />
    <script>
      // Apply the saved theme before the first paint, so the page never flashes the default theme.
      try {
        var saved = localStorage.getItem('splitwise-theme')
        if (saved === 'aurora' || saved === 'neon' || saved === 'solar') document.documentElement.dataset.theme = saved
      } catch (e) {
        /* storage blocked: keep the default */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
