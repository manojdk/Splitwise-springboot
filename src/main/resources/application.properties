spring.application.name=splitwise-api

# --- Database (PostgreSQL). Credentials come from the environment; nothing secret lives in this file.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/splitwise}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Load lazy associations of a page in batches (a few queries per page instead of one per row)
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.flyway.enabled=true

# --- JWT. JWT_SECRET must be at least 32 bytes; the app refuses to start otherwise.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:PT1H}
app.jwt.max-session=${JWT_MAX_SESSION:P7D}
app.jwt.issuer=splitwise-api

# --- Scheduled jobs: recurring expenses are created hourly at minute 5 (Spring cron: s m h dom mon dow)
app.scheduling.enabled=true
app.recurring.cron=${RECURRING_CRON:0 5 * * * *}

# --- API docs: Swagger UI at /swagger-ui.html, OpenAPI JSON at /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- Actuator: only expose health
management.endpoints.web.exposure.include=health

server.error.include-stacktrace=never
