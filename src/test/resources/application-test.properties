# Test profile: in-memory H2 in PostgreSQL compatibility mode, so tests need no external database.
# Flyway runs the same V1 migration as production.
spring.datasource.url=jdbc:h2:mem:splitwise;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Test-only signing key (not a real secret).
# Tests run the recurring-expense job themselves, with a controlled clock
app.scheduling.enabled=false

app.jwt.secret=test-only-secret-key-that-is-at-least-32-bytes-long

# Tests sign up hundreds of users from one address; the per-address limit is tested on its own (LoginThrottleTest)
app.auth.max-requests-per-minute=1000000
