# Test profile: in-memory H2 in PostgreSQL compatibility mode, so tests need no external database.
# Flyway runs the same V1 migration as production.
spring.datasource.url=jdbc:h2:mem:splitwise;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Test-only signing key (not a real secret).
app.jwt.secret=test-only-secret-key-that-is-at-least-32-bytes-long
