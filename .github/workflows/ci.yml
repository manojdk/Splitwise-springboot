name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # The frontend profile builds the React app into the jar, so this also proves one jar serves both
      - name: Build and test
        run: ./mvnw -B -Pfrontend verify

      - name: The jar carries the web app
        run: unzip -l target/splitwise-api.jar | grep -q 'BOOT-INF/classes/static/index.html'

  postgres:
    # Same test suite against a real PostgreSQL 16 instead of H2, to prove the Flyway migration and
    # the queries on the production database engine.
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: splitwise_ci
          POSTGRES_USER: splitwise
          POSTGRES_PASSWORD: splitwise-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U splitwise -d splitwise_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Environment variables override the H2 settings of the test profile
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/splitwise_ci
      SPRING_DATASOURCE_USERNAME: splitwise
      SPRING_DATASOURCE_PASSWORD: splitwise-ci-only
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Test against PostgreSQL
        run: ./mvnw -B verify

  frontend:
    # React app: lint, type check, tests (against a fake API), production build, and a check that the
    # generated API types match the committed OpenAPI spec (which the backend's OpenApiSpecTest keeps current).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: API types match openapi.json
        run: |
          npm run api:types
          git diff --exit-code -- src/api/schema.d.ts
